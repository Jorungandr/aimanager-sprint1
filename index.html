<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>爱管理 · Sprint 1</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="shell">
  <header class="topbar"><div><p class="eyebrow">爱管理 · Sprint 1 E01</p><h1>用户管理与权限</h1><p class="sub">有人、有项目、有角色、有权限隔离</p></div><button id="logout" class="secondary" hidden>退出登录</button></header>
  <p id="notice" role="status" aria-live="polite"></p>
  <section id="setupPanel" class="panel" hidden><h2>初始化管理员</h2><p>首次使用时创建平台管理员。请使用演示账号，不要输入真实凭证。</p><form id="setupForm"><label>邮箱<input name="email" type="email" required></label><label>密码<input name="password" type="password" minlength="8" required></label><button>创建并登录</button></form></section>
  <section id="loginPanel" class="panel" hidden><h2>登录工作空间</h2><form id="loginForm"><label>邮箱<input name="email" type="email" required></label><label>密码<input name="password" type="password" required></label><button>登录</button></form></section>
  <main id="workspace" hidden>
    <section class="summary"><div><span>当前账号</span><strong id="currentUser">—</strong></div><div><span>项目</span><strong id="projectCount">0</strong></div><div><span>角色</span><strong id="roleCount">0</strong></div></section>
    <section id="adminPanel" class="panel" hidden><h2>管理员配置</h2>
      <div class="form-grid"><form id="roleForm"><h3>创建角色</h3><label>角色名称<input name="name" maxlength="30" required placeholder="如 项目经理"></label><button>创建角色</button></form>
      <form id="userForm"><h3>创建演示账号</h3><label>邮箱<input name="email" type="email" required></label><label>密码<input name="password" type="password" minlength="8" required></label><button>创建账号</button></form></div>
      <h3>角色—权限矩阵</h3><div class="table-wrap"><table id="matrix"><thead><tr><th>角色</th><th>查看项目</th><th>管理成员</th><th>管理项目</th><th>管理角色</th><th>操作</th></tr></thead><tbody></tbody></table></div>
      <form id="projectForm"><h3>创建项目</h3><label>项目名称<input name="name" maxlength="60" required placeholder="如 蜂鸟演示项目"></label><button>创建项目</button></form>
    </section>
    <section class="panel"><h2>项目与成员</h2><div id="projects"></div></section>
    <section id="checkPanel" class="panel"><h2>权限验证</h2><p>选择项目后，向服务器发起“查看成员”和“管理成员”请求，直接观察访问控制结果。</p><div class="inline"><select id="checkProject" aria-label="选择项目"></select><button id="checkView" type="button" class="secondary">检查项目访问</button><button id="checkManage" type="button" class="secondary">检查成员管理权限</button></div><pre id="checkResult"></pre></section>
  </main><footer>教学演示原型 · 本机运行 · 服务器执行权限校验</footer>
</div><script src="app.js"></script></body></html>
